# Sets default memory used for gradle commands
org.gradle.jvmargs=-Xmx3G -Dnet.minecraftforge.gradle.check.certs=false -Dhttps.protocols=TLSv1.2,TLSv1.3 -Djdk.tls.client.protocols=TLSv1.2,TLSv1.3
org.gradle.daemon=false

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Mod metadata
mod_id=securehttpskins
mod_name=Secure HTTP Skins
mod_license=MIT
mod_version=1.0.1-1.20.1FORGE
mod_group_id=com.securehttpskins.forge
mod_authors=SecureHttpSkins
mod_description=Forces Minecraft skin and cape texture downloads to use HTTPS instead of plain HTTP, so skins load even where HTTP traffic to Mojang's texture servers is blocked or throttled.
